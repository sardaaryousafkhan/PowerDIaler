name: RBAC isolation

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  isolation-skeleton:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared + generate Prisma
        run: pnpm --filter @powerdialer/shared run build && pnpm --filter @powerdialer/api exec prisma generate
      - name: RBAC isolation suite
        env:
          RBAC_ENFORCE_ADMIN_PERMS: "true"
          DEMO_MODE: "1"
          DATABASE_URL: "file:./prisma/rbac-ci.db"
        run: |
          pnpm --filter @powerdialer/api exec prisma db push --skip-generate
          pnpm run test:rbac
